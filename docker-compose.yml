# ─────────────────────────────────────────────────────────────
# zeprio — Organization Profile & Operations Hub
# Static landing page served via nginx
# ─────────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d
#   # Open http://127.0.0.1:${PORT:-8080}
# ─────────────────────────────────────────────────────────────

services:
  zeprio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zeprio
    image: ghcr.io/onebyjorah/zeprio:latest
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
